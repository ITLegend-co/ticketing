name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sign.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test Android app
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Retain unsigned build for signing
        uses: actions/upload-artifact@v4
        with:
          name: Android-unsigned-build
          path: android/app/build/outputs/apk/release/*unsigned.apk
      - name: Sign and publish if release credentials are configured
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::notice::Android build passed. Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, then run this workflow again to publish the installable APK."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/helpdesk-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          APK="Mountain-Torq-Helpdesk-$VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE_FILE" --ks-key-alias helpdesk --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > SHA256SUMS-Android.txt
          gh release create "android-v$VERSION" "$APK" SHA256SUMS-Android.txt --target "$GITHUB_SHA" --latest=false --title "Android Helpdesk $VERSION" --notes-file android/RELEASE-NOTES.md
          printf '{"version":"%s"}\n' "$VERSION" > public/mobile-release.json
          echo "published=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.published == 'true'
        with:
          name: Android-published-manifest
          path: public/mobile-release.json
  publish-download:
    needs: android
    if: needs.android.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: Android-published-manifest
          path: public
      - name: Keep the website download manifest in source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mobile-release.json
          git diff --cached --quiet || git commit -m "Publish Android APK download"
          git push origin HEAD:main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
