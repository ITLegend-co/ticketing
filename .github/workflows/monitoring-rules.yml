name: Test monitoring permissions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['database.rules.json', 'tests/monitoring-emulator.mjs', 'firebase.monitoring-tests.json', '.github/workflows/monitoring-rules.yml']
permissions:
  contents: read
jobs:
  monitoring-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test Firebase monitoring permissions
        run: npx --yes firebase-tools emulators:exec --project demo-mtmonitor --config firebase.monitoring-tests.json --only auth,database "node tests/monitoring-emulator.mjs"
