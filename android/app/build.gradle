plugins { id 'com.android.application' }
android {
  namespace 'com.mountaintorq.helpdesk'
  compileSdk 35
  defaultConfig {
    applicationId 'com.mountaintorq.helpdesk'
    minSdk 26
    targetSdk 35
    versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
    versionName System.getenv('ANDROID_VERSION_NAME') ?: '1.0.1'
    testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  }
  buildFeatures { buildConfig true }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError true; disable 'ObsoleteSdkInt' }
}
dependencies {
  implementation 'androidx.work:work-runtime:2.10.1'
  implementation 'androidx.webkit:webkit:1.12.1'
  testImplementation 'org.json:json:20240303'
  testImplementation 'junit:junit:4.13.2'
}

